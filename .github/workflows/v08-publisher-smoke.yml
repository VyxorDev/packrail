name: v0.8 Publisher Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v08-publisher-smoke.yml

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Generate full ripgrep submission metadata
        shell: bash
        run: |
          set -euo pipefail
          go build -o prl ./cmd/prl
          ./prl package generate BurntSushi/ripgrep --command rg > ripgrep.json
          python - <<'PY'
          import json
          from pathlib import Path

          pkg = json.loads(Path('ripgrep.json').read_text())
          assert pkg['name'] == 'ripgrep'
          artifacts = pkg['artifacts']
          expected = {
              'windows-amd64', 'windows-arm64',
              'linux-amd64', 'linux-arm64',
              'darwin-amd64', 'darwin-arm64',
          }
          assert set(artifacts) == expected, set(artifacts)
          assert 'msvc' in artifacts['windows-amd64']['url']
          assert 'unknown-linux-gnu' in artifacts['linux-arm64']['url']
          # ripgrep 15.2.0 has no x86_64 GNU Linux archive, so musl is the
          # correct fallback for linux-amd64.
          assert 'unknown-linux-musl' in artifacts['linux-amd64']['url']
          assert pkg['command']['name'] == 'rg'
          PY
          ./prl registry validate --online
