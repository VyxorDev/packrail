name: v0.8 Publisher Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v08-publisher-smoke.yml

permissions:
  contents: read

jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Generate full ripgrep submission metadata
        shell: bash
        run: |
          set -euo pipefail
          go build -o prl ./cmd/prl
          ./prl package generate BurntSushi/ripgrep --command rg > ripgrep.json
          grep -q '"name": "ripgrep"' ripgrep.json
          grep -q '"windows-amd64"' ripgrep.json
          grep -q '"linux-amd64"' ripgrep.json
          grep -q '"darwin-arm64"' ripgrep.json
          grep -q 'unknown-linux-gnu' ripgrep.json
          if grep -q 'unknown-linux-musl' ripgrep.json; then
            echo 'publisher selected musl despite GNU artifact availability'
            exit 1
          fi
          ./prl registry validate --online
