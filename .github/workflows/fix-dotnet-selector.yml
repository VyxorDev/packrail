name: Fix .NET Runtime Selector

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dotnet-selector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the .NET runtime host archive
        shell: python
        run: |
          from pathlib import Path
          path = Path('internal/runtimes/runtimes.go')
          text = path.read_text()
          old = '''\tfor _, file := range files {
          \t\tif file.RID != rid || strings.TrimSpace(file.URL) == "" || strings.TrimSpace(file.Hash) == "" {
          \t\t\tcontinue
          \t\t}'''
          new = '''\tfor _, file := range files {
          \t\tif file.RID != rid || !strings.HasPrefix(file.Name, "dotnet-runtime-") || strings.TrimSpace(file.URL) == "" || strings.TrimSpace(file.Hash) == "" {
          \t\t\tcontinue
          \t\t}'''
          if old not in text:
              raise SystemExit('expected .NET file selector block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/runtimes/runtimes.go
          git commit -m "fix: select the .NET runtime host archive"
          git push origin HEAD:main
