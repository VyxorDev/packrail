name: v0.8 Release Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v08-release-smoke.yml

permissions:
  contents: read

jobs:
  bootstrap:
    name: bootstrap-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export PACKRAIL_INSTALL_DIR="$RUNNER_TEMP/packrail-bin"
          sh scripts/install.sh
          "$PACKRAIL_INSTALL_DIR/prl" version | grep -q 'prl 0.8.0-alpha'
      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PACKRAIL_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'packrail-bin'
          & .\scripts\install.ps1
          $out = (& (Join-Path $env:PACKRAIL_INSTALL_DIR 'prl.exe') version) -join "`n"
          if ($out -notmatch 'prl 0.8.0-alpha') { throw "unexpected version: $out" }

  self-update:
    name: self-update-${{ matrix.os }}-v07-to-v08
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download v0.7 and self-update on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/prl"
          curl -fsSL https://github.com/VyxorDev/packrail/releases/download/v0.7.0-alpha/prl-linux-amd64 -o "$path"
          chmod +x "$path"
          "$path" version | grep -q 'prl 0.7.0-alpha'
          "$path" self update
          "$path" version | grep -q 'prl 0.8.0-alpha'
      - name: Download v0.7 and self-update on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'prl.exe'
          Invoke-WebRequest -UseBasicParsing https://github.com/VyxorDev/packrail/releases/download/v0.7.0-alpha/prl-windows-amd64.exe -OutFile $path
          $before = (& $path version) -join "`n"
          if ($before -notmatch 'prl 0.7.0-alpha') { throw "unexpected initial version: $before" }
          & $path self update
          $after = (& $path version) -join "`n"
          if ($after -notmatch 'prl 0.8.0-alpha') { throw "unexpected updated version: $after" }
