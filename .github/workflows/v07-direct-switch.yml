name: v0.7 Direct Install Switch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v07-direct-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use current-platform generation for direct installs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cmd/prl/main.go')
          text = path.read_text()
          old = 'publisher.New().Generate(repo, "")'
          new = 'publisher.New().GenerateForPlatform(repo, "", runtime.GOOS, runtime.GOARCH)'
          if old not in text:
              raise SystemExit('direct install Generate call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w cmd/prl/main.go
          go test ./...
          go vet ./...
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cmd/prl/main.go
          git commit -m "perf: inspect only current platform for direct installs"
          git push origin HEAD:main
