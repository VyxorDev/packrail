name: v0.7 Source Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v07-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python scripts/v07_patch.py
      - name: Format and test
        run: |
          gofmt -w cmd/prl/main.go internal/publisher/publisher.go internal/publisher/runtime_inference.go internal/selfupdate/*.go
          go test ./...
          go vet ./...
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cmd/prl/main.go
          git add internal/publisher/publisher.go internal/publisher/runtime_inference.go internal/selfupdate
          git commit -m "feat: add direct GitHub installs and self-update"
          git push origin HEAD:main
