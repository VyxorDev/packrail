name: v0.8 Integration Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v08-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Apply v0.8 integration
        run: python scripts/v08_patch.py
      - name: Format and verify
        run: |
          gofmt -w cmd/prl/main.go cmd/prl/registry_admin.go internal/registry/*.go internal/submit/*.go internal/publisher/*.go
          go test ./...
          go vet ./...
          go run ./cmd/prl registry validate
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/prl/main.go cmd/prl/registry_admin.go internal/registry internal/publisher internal/submit registry VERSION
          git commit -m "feat: add self-service registry submissions"
          git push origin HEAD:main
