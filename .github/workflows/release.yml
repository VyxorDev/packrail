name: Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'VyxorDev/packrail'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 0.8.0-alpha
      RELEASE_CONFIRM: v0.8.0-alpha
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Validate release intent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRM" = "v$RELEASE_VERSION"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          grep -Fq "const version = \"$RELEASE_VERSION\"" cmd/prl/main.go
          go test ./...
          go vet ./...
          go run ./cmd/prl registry validate --online

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1"
            local goarch="$2"
            local output="$3"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "dist/$output" ./cmd/prl
          }

          build windows amd64 prl-windows-amd64.exe
          build windows arm64 prl-windows-arm64.exe
          build linux amd64 prl-linux-amd64
          build linux arm64 prl-linux-arm64
          build darwin amd64 prl-macos-amd64
          build darwin arm64 prl-macos-arm64

          ./dist/prl-linux-amd64 version | grep -q "prl $RELEASE_VERSION"
          (cd dist && sha256sum prl-* > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 6
          cat dist/SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          cat > RELEASE_NOTES.md <<EOF
          Packrail $tag

          Self-service GitHub registry submissions, split package manifests, registry provenance/ownership gates, and hardened multi-platform release inference.

          Cross-platform prl binaries for Windows, Linux, and macOS on x64 and ARM64. Verify downloaded binaries with SHA256SUMS.txt.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite an existing published version."
            exit 1
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Packrail $tag" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            dist/*
