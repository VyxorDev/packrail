name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.9.0-alpha
        required: true
        type: string
      confirm:
        description: Type the exact release tag, for example v0.9.0-alpha
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'VyxorDev/packrail'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Validate release intent
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRM" = "v$RELEASE_VERSION"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          grep -Fq "const version = \"$RELEASE_VERSION\"" cmd/prl/main.go
          go test ./...
          go vet ./...
          go run ./cmd/prl registry validate --online

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1"
            local goarch="$2"
            local output="$3"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" -o "dist/$output" ./cmd/prl
          }

          build windows amd64 prl-windows-amd64.exe
          build windows arm64 prl-windows-arm64.exe
          build linux amd64 prl-linux-amd64
          build linux arm64 prl-linux-arm64
          build darwin amd64 prl-macos-amd64
          build darwin arm64 prl-macos-arm64

          ./dist/prl-linux-amd64 version | grep -q "prl $RELEASE_VERSION"
          (cd dist && sha256sum prl-* > SHA256SUMS.txt)
          test "$(wc -l < dist/SHA256SUMS.txt)" -eq 6
          cat dist/SHA256SUMS.txt

      - name: Prepare version-pinned installer assets
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "\$env:PACKRAIL_INSTALL_VERSION = '$RELEASE_VERSION'" > dist/install.ps1
          cat scripts/install.ps1 >> dist/install.ps1

          printf '%s\n' "PACKRAIL_INSTALL_VERSION='$RELEASE_VERSION'" 'export PACKRAIL_INSTALL_VERSION' > dist/install.sh
          cat scripts/install.sh >> dist/install.sh
          chmod 755 dist/install.sh

          head -n 1 dist/install.ps1 | grep -Fq "PACKRAIL_INSTALL_VERSION = '$RELEASE_VERSION'"
          head -n 1 dist/install.sh | grep -Fq "PACKRAIL_INSTALL_VERSION='$RELEASE_VERSION'"
          sh -n dist/install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          {
            echo "# Packrail $tag"
            echo
            awk -v version="$RELEASE_VERSION" '
              index($0, "## " version) == 1 { printing = 1; next }
              printing && /^## / { exit }
              printing { print }
            ' CHANGELOG.md
            echo
            echo "Cross-platform prl binaries for Windows, Linux, and macOS on x64 and ARM64."
            echo "The release includes version-pinned install.ps1 and install.sh bootstrap scripts."
            echo "Verify downloaded binaries with SHA256SUMS.txt."
          } > RELEASE_NOTES.md

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite an existing published version."
            exit 1
          fi

          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Packrail $tag" \
            --notes-file RELEASE_NOTES.md \
            "${release_flags[@]}" \
            dist/*

  installer-smoke-unix:
    name: release-installer-${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Install from published release asset
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          install_dir="$RUNNER_TEMP/packrail-release-smoke"
          export PACKRAIL_INSTALL_DIR="$install_dir"
          curl --retry 5 --retry-delay 2 -fsSL "https://github.com/VyxorDev/packrail/releases/download/$tag/install.sh" | sh
          "$install_dir/prl" version | grep -q "prl $RELEASE_VERSION"

  installer-smoke-windows:
    name: release-installer-windows-powershell-5.1
    needs: release
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Install from published release asset in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $url = "https://github.com/VyxorDev/packrail/releases/download/$tag/install.ps1"
          $env:PACKRAIL_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'packrail-release-smoke'

          $script = $null
          for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                  $script = Invoke-RestMethod -UseBasicParsing $url
                  break
              }
              catch {
                  if ($attempt -eq 5) { throw }
                  Start-Sleep -Seconds 2
              }
          }

          $script | Invoke-Expression
          $output = (& (Join-Path $env:PACKRAIL_INSTALL_DIR 'prl.exe') version) -join "`n"
          if ($output -notmatch [regex]::Escape("prl $env:RELEASE_VERSION")) {
              throw "unexpected Packrail version: $output"
          }
