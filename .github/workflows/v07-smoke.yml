name: v0.7 Zero Friction Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v07-smoke.yml

permissions:
  contents: read

jobs:
  direct-native:
    name: direct-ripgrep-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build on Unix
        if: runner.os != 'Windows'
        run: go build -o prl ./cmd/prl
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: go build -o prl.exe ./cmd/prl
      - name: Direct-install ripgrep on Unix
        if: runner.os != 'Windows'
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-direct-rg
        shell: bash
        run: |
          set -euo pipefail
          ./prl install github:BurntSushi/ripgrep
          test -x "$PACKRAIL_HOME/bin/rg"
          "$PACKRAIL_HOME/bin/rg" --version | grep -q 'ripgrep 15.2.0'
          test -f "$PACKRAIL_HOME/packages/ripgrep/15.2.0/.packrail.json"
      - name: Direct-install ripgrep on Windows
        if: runner.os == 'Windows'
        env:
          PACKRAIL_HOME: ${{ runner.temp }}\packrail-direct-rg
        shell: pwsh
        run: |
          .\prl.exe install github:BurntSushi/ripgrep
          if (-not (Test-Path "$env:PACKRAIL_HOME\bin\rg.cmd")) { throw 'rg shim missing' }
          $out = (& "$env:PACKRAIL_HOME\bin\rg.cmd" --version) -join "`n"
          if ($out -notmatch 'ripgrep 15.2.0') { throw "unexpected rg output: $out" }
          if (-not (Test-Path "$env:PACKRAIL_HOME\packages\ripgrep\15.2.0\.packrail.json")) { throw 'install record missing' }

  direct-managed-runtime:
    name: direct-starterqueue-managed-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build prl
        run: go build -o prl ./cmd/prl
      - name: Install StarterQueue directly from GitHub
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-direct-starterqueue
        shell: bash
        run: |
          set -euo pipefail
          ./prl install github:VyxorDev/starterqueue
          test -x "$PACKRAIL_HOME/bin/starterqueue"
          test -d "$PACKRAIL_HOME/runtimes/node"
          grep -q '"managed_runtime": true' "$PACKRAIL_HOME/packages/starterqueue/0.5.0/.packrail.json"

  bootstrap-syntax:
    name: bootstrap-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
