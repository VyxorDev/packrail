name: Backfill Release History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    if: github.repository == 'VyxorDev/packrail'
    runs-on: ubuntu-latest
    steps:
      - name: Create historical Packrail alpha releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          create_release() {
            tag="$1"
            title="$2"
            milestone="$3"
            notes="$4"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists; skipping"
              return
            fi

            gh release create "$tag" \
              --title "$title" \
              --notes "$notes

Historical milestone commit: $milestone" \
              --prerelease
          }

          create_release \
            "v0.1.0-alpha" \
            "Packrail v0.1.0-alpha" \
            "d57a8eaa83c8fd33e956e382e114bf776955ba65" \
            "The first working Packrail foundation: the prl CLI, GitHub-backed package metadata, SHA-256 verification, safe .tgz extraction, isolated installs, command shims, and cross-platform CI. StarterQueue served as the first package proof."

          create_release \
            "v0.2.0-alpha" \
            "Packrail v0.2.0-alpha" \
            "e667f5fb7e34b6010de1df211e30c2660f10ba2c" \
            "Added Packrail-managed Node.js runtimes. prl can install a Node-based tool without requiring Node to be installed globally, while keeping the runtime private under the Packrail home directory."

          create_release \
            "v0.3.0-alpha" \
            "Packrail v0.3.0-alpha" \
            "f0fb772015b7a5171397c417c543f8de205f45ae" \
            "Added platform-aware packages, safe ZIP extraction, native executable shims, and ripgrep as the second package. Packrail resolves Windows, Linux, and macOS artifacts across x64 and ARM64."

          create_release \
            "v0.4.0-alpha" \
            "Packrail v0.4.0-alpha" \
            "7c64cfad7aa462ddb2fe91b10dcd33791e258b5b" \
            "Moved package metadata to a live GitHub-backed registry with validation, local caching, automatic refresh, offline fallback, and prl registry sync/status commands. New registry entries no longer require a new prl binary."

          create_release \
            "v0.5.0-alpha" \
            "Packrail v0.5.0-alpha" \
            "31845d9c6633ead389f080d540993f2cb45c5662" \
            "Added publisher-side GitHub release inspection and package draft generation. prl can inspect release assets, classify platforms, use GitHub SHA-256 digests, and infer npm-style CLI metadata such as Node constraints, commands, and entrypoints."
