name: Backfill Release History

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Create Packrail alpha releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          create_release() {
            tag="$1"
            title="$2"
            milestone="$3"
            summary="$4"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already exists; skipping"
              return
            fi

            gh release create "$tag" --title "$title" --prerelease --notes "$summary Historical milestone commit: $milestone"
          }

          create_release "v0.1.0-alpha" "Packrail v0.1.0-alpha" "d57a8eaa83c8fd33e956e382e114bf776955ba65" "First working Packrail foundation with the prl CLI, SHA-256 verification, safe tgz extraction, isolated installs, command shims, and cross-platform CI."
          create_release "v0.2.0-alpha" "Packrail v0.2.0-alpha" "e667f5fb7e34b6010de1df211e30c2660f10ba2c" "Added Packrail-managed Node.js runtimes so Node-based tools can install without a global Node installation."
          create_release "v0.3.0-alpha" "Packrail v0.3.0-alpha" "f0fb772015b7a5171397c417c543f8de205f45ae" "Added platform-aware packages, safe ZIP extraction, native executable shims, and ripgrep as package number two."
          create_release "v0.4.0-alpha" "Packrail v0.4.0-alpha" "7c64cfad7aa462ddb2fe91b10dcd33791e258b5b" "Added the live GitHub-backed registry with validation, local caching, automatic refresh, offline fallback, and registry sync/status commands."
          create_release "v0.5.0-alpha" "Packrail v0.5.0-alpha" "31845d9c6633ead389f080d540993f2cb45c5662" "Added publisher-side GitHub release inspection and automatic Packrail package draft generation."
