name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build prl
        run: go build ./cmd/prl

  smoke:
    name: managed-runtime-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl
        run: go build -o prl ./cmd/prl

      - name: Install StarterQueue without system runtime dependency
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-smoke
        run: |
          ./prl install starterqueue
          test -x "$PACKRAIL_HOME/bin/starterqueue"
          test -d "$PACKRAIL_HOME/runtimes/node"
          grep -q '"managed_runtime": true' "$PACKRAIL_HOME/packages/starterqueue/0.5.0/.packrail.json"
          ./prl doctor
