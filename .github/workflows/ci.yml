name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build prl
        run: go build ./cmd/prl

  publisher-smoke:
    name: publisher-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl
        run: go build -o prl ./cmd/prl

      - name: Inspect generate and add StarterQueue metadata
        run: |
          ./prl package inspect VyxorDev/starterqueue | tee inspect.txt
          grep -q 'starterqueue-0.5.0.tgz' inspect.txt
          ./prl package generate VyxorDev/starterqueue > package-draft.json
          grep -q '"name": "starterqueue"' package-draft.json
          grep -q '"constraint": ">=20"' package-draft.json
          grep -q 'package/dist/src/cli.js' package-draft.json
          grep -q '98dbcaa198576cb168f4ee024135e4fb910b91a8757763f45280809ebca46560' package-draft.json
          cp internal/registry/data/packages.json registry-copy.json
          ./prl package add VyxorDev/starterqueue --registry registry-copy.json
          grep -q '"name": "starterqueue"' registry-copy.json

  registry-smoke:
    name: registry-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl
        run: go build -o prl ./cmd/prl

      - name: Sync and use GitHub registry
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-registry
        run: |
          ./prl registry status | grep -q 'embedded'
          ./prl registry sync
          ./prl registry status | grep -q 'cache'
          test -f "$PACKRAIL_HOME/registry/packages.json"
          ./prl search ripgrep | grep -q 'ripgrep'

  managed-runtime-smoke:
    name: managed-runtime-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl
        run: go build -o prl ./cmd/prl

      - name: Install StarterQueue without system runtime dependency
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-smoke
        run: |
          ./prl install starterqueue
          test -x "$PACKRAIL_HOME/bin/starterqueue"
          test -d "$PACKRAIL_HOME/runtimes/node"
          grep -q '"managed_runtime": true' "$PACKRAIL_HOME/packages/starterqueue/0.5.0/.packrail.json"
          ./prl doctor

  lifecycle-smoke:
    name: lifecycle-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl
        run: go build -o prl ./cmd/prl

      - name: Install update and remove a native package
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-lifecycle
        run: |
          ./prl install ripgrep
          test -x "$PACKRAIL_HOME/bin/rg"
          ./prl update ripgrep | grep -q 'already up to date'
          ./prl remove ripgrep
          test ! -e "$PACKRAIL_HOME/bin/rg"
          test ! -e "$PACKRAIL_HOME/packages/ripgrep"
          ./prl list | grep -q 'No packages installed'

  native-package-smoke:
    name: native-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl on Unix
        if: runner.os != 'Windows'
        run: go build -o prl ./cmd/prl

      - name: Build prl on Windows
        if: runner.os == 'Windows'
        run: go build -o prl.exe ./cmd/prl

      - name: Install and run ripgrep on Unix
        if: runner.os != 'Windows'
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-ripgrep
        run: |
          ./prl install ripgrep
          "$PACKRAIL_HOME/bin/rg" --version | grep -q 'ripgrep 15.2.0'
          test -f "$PACKRAIL_HOME/packages/ripgrep/15.2.0/.packrail.json"

      - name: Install and run ripgrep on Windows
        if: runner.os == 'Windows'
        env:
          PACKRAIL_HOME: ${{ runner.temp }}/packrail-ripgrep
        shell: pwsh
        run: |
          .\prl.exe install ripgrep
          $output = (& "$env:PACKRAIL_HOME\bin\rg.cmd" --version) -join "`n"
          if ($output -notmatch 'ripgrep 15.2.0') { throw "unexpected ripgrep version: $output" }
          if (-not (Test-Path "$env:PACKRAIL_HOME\packages\ripgrep\15.2.0\.packrail.json")) { throw 'install record missing' }

  windows-powershell-bootstrap-smoke:
    name: windows-powershell-5.1-bootstrap
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checked-out installer in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PACKRAIL_INSTALL_VERSION = '0.8.0-alpha'
          $env:PACKRAIL_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'packrail-windows-powershell'
          & .\scripts\install.ps1
          $output = (& (Join-Path $env:PACKRAIL_INSTALL_DIR 'prl.exe') version) -join "`n"
          if ($output -notmatch 'prl 0.8.0-alpha') { throw "unexpected Packrail version: $output" }

  project-smoke:
    name: project-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl on Unix
        if: runner.os != 'Windows'
        run: go build -o prl ./cmd/prl

      - name: Build prl on Windows
        if: runner.os == 'Windows'
        run: go build -o prl.exe ./cmd/prl

      - name: Project manifest lifecycle on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./prl init
          grep -q '"manifest_version": 1' packrail.json
          PACKRAIL_HOME="$RUNNER_TEMP/packrail-project-add" ./prl add ripgrep@15.2.0
          grep -q '"ripgrep"' packrail.json
          grep -q '"constraint": "15.2.0"' packrail.json
          grep -q '"lockfile_version": 2' packrail.lock
          ./prl lock validate | grep -q 'Lockfile valid: 1 package (version 2)'
          PACKRAIL_HOME="$RUNNER_TEMP/packrail-project-sync" ./prl sync | tee project-sync-first.txt
          grep -q '1 installed/updated, 0 already in sync' project-sync-first.txt
          "$RUNNER_TEMP/packrail-project-sync/bin/rg" --version | grep -q 'ripgrep 15.2.0'
          PACKRAIL_HOME="$RUNNER_TEMP/packrail-project-sync" ./prl sync | grep -q '0 installed/updated, 1 already in sync'
          ./prl remove ripgrep
          grep -Fq '"dependencies": {}' packrail.json
          grep -Fq '"packages": []' packrail.lock
          ./prl sync | grep -q 'Nothing to sync'
          test -x "$RUNNER_TEMP/packrail-project-add/bin/rg"

      - name: Project manifest lifecycle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\prl.exe init
          $manifest = Get-Content .\packrail.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 1) { throw 'expected manifest v1' }
          $env:PACKRAIL_HOME = Join-Path $env:RUNNER_TEMP 'packrail-project-add'
          .\prl.exe add ripgrep@15.2.0
          $manifest = Get-Content .\packrail.json -Raw | ConvertFrom-Json
          if ($manifest.dependencies.ripgrep.constraint -ne '15.2.0') { throw 'manifest constraint missing' }
          $lock = Get-Content .\packrail.lock -Raw | ConvertFrom-Json
          if ($lock.lockfile_version -ne 2 -or $lock.packages.Count -ne 1) { throw 'lockfile state invalid' }
          $env:PACKRAIL_HOME = Join-Path $env:RUNNER_TEMP 'packrail-project-sync'
          $first = (.\prl.exe sync) -join "`n"
          if ($first -notmatch '1 installed/updated, 0 already in sync') { throw "unexpected first sync: $first" }
          $rg = (& "$env:PACKRAIL_HOME\bin\rg.cmd" --version) -join "`n"
          if ($rg -notmatch 'ripgrep 15.2.0') { throw "unexpected ripgrep: $rg" }
          $second = (.\prl.exe sync) -join "`n"
          if ($second -notmatch '0 installed/updated, 1 already in sync') { throw "unexpected second sync: $second" }
          .\prl.exe remove ripgrep
          $manifest = Get-Content .\packrail.json -Raw | ConvertFrom-Json
          $lock = Get-Content .\packrail.lock -Raw | ConvertFrom-Json
          if ($manifest.dependencies.PSObject.Properties.Count -ne 0) { throw 'manifest dependency was not removed' }
          if ($lock.packages.Count -ne 0) { throw 'lock package was not removed' }
          $empty = (.\prl.exe sync) -join "`n"
          if ($empty -notmatch 'Nothing to sync') { throw "unexpected empty sync: $empty" }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'packrail-project-add\bin\rg.cmd'))) { throw 'default project remove uninstalled the shared package' }

  lockfile-runtime-smoke:
    name: lockfile-runtime-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Build prl on Unix
        if: runner.os != 'Windows'
        run: go build -o prl ./cmd/prl

      - name: Build prl on Windows
        if: runner.os == 'Windows'
        run: go build -o prl.exe ./cmd/prl

      - name: Add and sync a runtime package from v2 lockfile on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PACKRAIL_HOME="$RUNNER_TEMP/packrail-runtime-add" ./prl add starterqueue
          grep -q '"manifest_version": 1' packrail.json
          grep -q '"starterqueue"' packrail.json
          grep -q '"lockfile_version": 2' packrail.lock
          grep -q '"runtimes"' packrail.lock
          platform="$(go env GOOS)-$(go env GOARCH)"
          export PLATFORM="$platform"
          add_version="$(python3 -c 'import json,os; d=json.load(open("packrail.lock")); p=d["runtimes"]["node|>=20|node"]["artifacts"][os.environ["PLATFORM"]]; assert p["url"].startswith("https://"); assert len(p["sha256"]) in (64,128); print(p["version"])')"
          PACKRAIL_HOME="$RUNNER_TEMP/packrail-runtime-sync" ./prl sync
          sync_version="$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/packrail-runtime-sync/packages/starterqueue/0.5.0/.packrail.json"))["runtime_version"])')"
          test "$add_version" = "$sync_version"
          test -x "$RUNNER_TEMP/packrail-runtime-sync/bin/starterqueue"

      - name: Add and sync a runtime package from v2 lockfile on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PACKRAIL_HOME = Join-Path $env:RUNNER_TEMP 'packrail-runtime-add'
          .\prl.exe add starterqueue
          $manifest = Get-Content .\packrail.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 1 -or -not $manifest.dependencies.starterqueue) { throw 'project manifest missing starterqueue' }
          $lock = Get-Content .\packrail.lock -Raw | ConvertFrom-Json
          if ($lock.lockfile_version -ne 2) { throw 'expected lockfile v2' }
          $key = 'node|>=20|node'
          $platform = "windows-$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -eq 'AMD64') { $platform = 'windows-amd64' }
          elseif ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { $platform = 'windows-arm64' }
          $pin = $lock.runtimes.$key.artifacts.$platform
          if (-not $pin.version -or -not $pin.url -or -not $pin.sha256) { throw 'incomplete Windows Node runtime pin' }
          $env:PACKRAIL_HOME = Join-Path $env:RUNNER_TEMP 'packrail-runtime-sync'
          .\prl.exe sync
          $record = Get-Content "$env:PACKRAIL_HOME\packages\starterqueue\0.5.0\.packrail.json" -Raw | ConvertFrom-Json
          if ($record.runtime_version -ne $pin.version) { throw "runtime drift: lock=$($pin.version) installed=$($record.runtime_version)" }
          if (-not (Test-Path "$env:PACKRAIL_HOME\bin\starterqueue.cmd")) { throw 'starterqueue shim missing' }
