name: v0.7 Launcher Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v07-launcher-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add universal launch arguments
        shell: python
        run: |
          from pathlib import Path

          registry = Path('internal/registry/registry.go')
          text = registry.read_text()
          old = '''type Command struct {
          \tName       string `json:"name"`
          \tEntrypoint string `json:"entrypoint,omitempty"`
          }'''
          new = '''type Command struct {
          \tName       string   `json:"name"`
          \tEntrypoint string   `json:"entrypoint,omitempty"`
          \tArgs       []string `json:"args,omitempty"`
          }'''
          if old not in text:
              raise SystemExit('registry Command block not found')
          registry.write_text(text.replace(old, new, 1))

          install = Path('internal/install/install.go')
          text = install.read_text()
          start = text.index('func writeShim(')
          end = text.index('\nfunc shellQuote(', start)
          replacement = r'''func writeShim(binDir, finalDir string, pkg registry.Package, entrypoint, runtimeExecutable string) error {
          	entry := filepath.Join(finalDir, filepath.FromSlash(entrypoint))
          	program := entry
          	if runtimeExecutable != "" {
          		program = runtimeExecutable
          	}
          	args := launchArgs(pkg.Command.Args, entry, runtimeExecutable != "")

          	if runtime.GOOS == "windows" {
          		shim := filepath.Join(binDir, pkg.Command.Name+".cmd")
          		parts := []string{"@echo off\r\n", cmdQuote(program)}
          		for _, arg := range args {
          			parts = append(parts, " ", cmdQuote(arg))
          		}
          		parts = append(parts, " %*\r\n")
          		if err := os.WriteFile(shim, []byte(strings.Join(parts, "")), 0o755); err != nil {
          			return fmt.Errorf("write Windows shim: %w", err)
          		}
          		return nil
          	}

          	shim := filepath.Join(binDir, pkg.Command.Name)
          	parts := []string{"#!/bin/sh\nexec ", shellQuote(program)}
          	for _, arg := range args {
          		parts = append(parts, " ", shellQuote(arg))
          	}
          	parts = append(parts, " \"$@\"\n")
          	if err := os.WriteFile(shim, []byte(strings.Join(parts, "")), 0o755); err != nil {
          		return fmt.Errorf("write Unix shim: %w", err)
          	}
          	return nil
          }

          func launchArgs(configured []string, entry string, hasRuntime bool) []string {
          	if len(configured) == 0 {
          		if hasRuntime {
          			return []string{entry}
          		}
          		return nil
          	}
          	args := make([]string, 0, len(configured)+1)
          	foundEntrypoint := false
          	for _, arg := range configured {
          		if arg == "{entrypoint}" {
          			args = append(args, entry)
          			foundEntrypoint = true
          		} else {
          			args = append(args, arg)
          		}
          	}
          	if hasRuntime && !foundEntrypoint {
          		args = append(args, entry)
          	}
          	return args
          }

          func cmdQuote(value string) string {
          	return "\"" + strings.ReplaceAll(value, "\"", "\"\"") + "\""
          }
          '''
          install.write_text(text[:start] + replacement + text[end:])

      - name: Format and test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/registry/registry.go internal/install/install.go
          go test ./internal/registry ./internal/install

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/registry/registry.go internal/install/install.go
          git commit -m "feat: add universal runtime launch arguments"
          git push origin HEAD:main
